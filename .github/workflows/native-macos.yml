name: Native macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Native build and tests
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packet analysis CLI
        timeout-minutes: 10
        run: |
          brew install --formula wireshark
          tshark --version
      - name: Build and test native app
        run: >-
          xcodebuild
          -project RVISentinel.xcodeproj
          -scheme RVISentinel
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build test
